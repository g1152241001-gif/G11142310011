    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            user-select: none;
            overflow-x: hidden;
        }

        /* 繪製鄉村與草原背景樣式 */
        .map-bg {
            background: linear-gradient(180deg, #87CEEB 0%, #BAE6FD 35%, #7C3AED 35.1%, #4ADE80 37%, #22C55E 100%);
            position: relative;
        }

        /* 熱氣球動態漂浮效果 */
        @keyframes balloonFloat {
            0% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-1deg); }
        }

        .hot-air-balloon {
            position: absolute;
            animation: balloonFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));
            transition: all 0.5s ease;
            z-index: 10;
        }

        /* 茅草屋點擊 hover 放大與淡出隱藏 */
        .hut-node {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
            cursor: pointer;
        }

        .hut-node:hover {
            transform: scale(1.15) translateY(-6px);
        }

        .hut-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5) !important;
        }

        /* 輕微晃動動畫 */
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.8)); }
            50% { filter: drop-shadow(0 0 18px rgba(250, 204, 21, 1)); }
        }

        .hut-pulse {
            animation: pulseGlow 2s infinite;
        }

        /* 自訂 Modal 動畫 */
        .modal-enter {
            animation: modalFadeIn 0.3s ease-out forwards;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 雲朵移動動畫 */
        @keyframes cloudMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        .animate-cloud-1 { animation: cloudMove 35s linear infinite; }
        .animate-cloud-2 { animation: cloudMove 50s linear infinite 15s; }
    </style>
</head>

            initHotAirBalloons();

        /**
         * 隨機生成熱氣球 (3~5 個，位置分散於上半部，大小隨機 1.0x, 1.2x, 1.5x)
         */
        function initHotAirBalloons() {
            const container = document.getElementById('balloons-container');
            container.innerHTML = ''; // 清空

            const balloonCount = Math.floor(Math.random() * 3) + 3; // 生成 3 到 5 個
            const scales = [1.0, 1.2, 1.5]; // 規定之倍率

            // 熱氣球顏色配色庫 (使用 SVG 動態生成高品質熱氣球)
            const balloonColors = [
                { main: '#FF5722', stripe: '#FFEB3B' },
                { main: '#3F51B5', stripe: '#00BCD4' },
                { main: '#E91E63', stripe: '#FFC107' },
                { main: '#4CAF50', stripe: '#8BC34A' },
                { main: '#9C27B0', stripe: '#FF4081' }
            ];

            for (let i = 0; i < balloonCount; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'hot-air-balloon';

                // 隨機選取放大倍率
                const scale = scales[Math.floor(Math.random() * scales.length)];

                // 隨機計算網頁上半部位置 (Top: 5% ~ 28%, Left: 5% ~ 85%)

                const randomLeft = Math.floor(Math.random() * 80) + 5;
                const animDelay = (Math.random() * 2).toFixed(1);

                balloon.style.top = `${randomTop}%`;
                balloon.style.left = `${randomLeft}%`;
                balloon.style.transform = `scale(${scale})`;
                balloon.style.animationDelay = `${animDelay}s`;

                const colors = balloonColors[i % balloonColors.length];

                // 繪製熱氣球 SVG

                    <svg width="60" height="80" viewBox="0 0 60 80">
                        <!-- 球體 -->
                        <path d="M30 5 C 10 5, 2 25, 12 50 C 18 60, 24 65, 25 65 L 35 65 C 36 65, 42 60, 48 50 C 58 25, 50 5, 30 5 Z" fill="${colors.main}" />
                        <path d="M 22 5 C 16 20, 16 50, 25 65 L 35 65 C 44 50, 44 20, 38 5 Z" fill="${colors.stripe}" />
                        <!-- 吊籃連接線 -->
                        <line x1="25" y1="65" x2="26" y2="72" stroke="#555" stroke-width="1.5" />
                        <line x1="35" y1="65" x2="34" y2="72" stroke="#555" stroke-width="1.5" />
                        <!-- 吊籃 -->
                        <rect x="24" y="72" width="12" height="8" rx="2" fill="#795548" />
                    </svg>
                `;

                container.appendChild(balloon);
            }
        }

        /**
         * 初始化地圖上的 10 個茅草屋/建築
         */
        function initHuts() {
            const container = document.getElementById('huts-container');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const pos = hutPositions[index];
                const hutNode = document.createElement('div');
                hutNode.id = `hut-${index}`;
                hutNode.className = 'hut-node absolute flex flex-col items-center group hut-pulse';
                hutNode.style.left = pos.left;
                hutNode.style.top = pos.top;

                // 茅草屋 SVG 圖像 + 標籤
                hutNode.innerHTML = `
                    <!-- 提示文字 -->
                    <div class="bg-white/90 text-amber-900 font-black text-xs px-2 py-0.5 rounded-full shadow-md mb-1 border border-amber-300 pointer-events-none">
                        #${index + 1}
                    </div>
                    <!-- 茅草屋圖示 (hut.png 替代高質感繪製 SVG) -->
                    <div class="w-14 h-14 sm:w-16 sm:h-16 relative">
                        <svg viewBox="0 0 100 100" class="w-full h-full filter drop-shadow-md">
                            <!-- 屋頂 (草頂) -->
                            <polygon points="50,15 10,50 90,50" fill="#D97706" />
                            <polygon points="50,15 20,50 80,50" fill="#F59E0B" />
                            <!-- 主牆壁 -->
                            <rect x="22" y="50" width="56" height="40" fill="#FEF3C7" rx="3" />
                            <!-- 大門 -->
                            <path d="M 42 90 A 8 8 0 0 1 58 90 Z" fill="#78350F" />
                            <rect x="42" y="68" width="16" height="22" fill="#78350F" />
                            <!-- 窗戶 -->
                            <rect x="28" y="58" width="10" height="10" fill="#60A5FA" rx="2" stroke="#78350F" stroke-width="1.5" />
                            <rect x="62" y="58" width="10" height="10" fill="#60A5FA" rx="2" stroke="#78350F" stroke-width="1.5" />
                        </svg>
                    </div>
                `;

                // 點擊觸發答題 Modal
                hutNode.addEventListener('click', () => openQuestionModal(index));
                container.appendChild(hutNode);
            });
        }

        /**
         * 開啟答題 Modal 視窗
         */
        function openQuestionModal(index) {
            if (answeredHuts.has(index)) return; // 若已回答過則忽略

            playBeepSound(600, 'sine', 0.1);
            currentHutIndex = index;
            const qData = questionsData[index];

            // 設定標題與題目
            document.getElementById('modal-hut-tag').innerText = `茅草屋 #${index + 1}`;
            document.getElementById('question-text').innerText = qData.question;

            // 隱藏解析盒，重置選項區
            const explBox = document.getElementById('explanation-box');
            explBox.classList.add('hidden');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // 渲染選項按鈕
            qData.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-slate-50 hover:bg-amber-50 hover:border-amber-400 font-medium text-slate-700 transition flex items-center justify-between group';
                btn.innerHTML = `
                    <span class="flex items-center">
                        <span class="w-7 h-7 rounded-full bg-slate-200 group-hover:bg-amber-400 group-hover:text-white text-slate-600 font-bold text-xs flex items-center justify-center mr-3 transition">
                            ${String.fromCharCode(65 + optIdx)}
                        </span>
                        <span>${optText}</span>
                    </span>
                    <i class="fa-regular fa-circle text-slate-300 group-hover:text-amber-500 text-lg"></i>
                `;
                btn.addEventListener('click', () => handleAnswerSelect(optIdx));
                optionsContainer.appendChild(btn);
            });

            document.getElementById('question-modal').classList.remove('hidden');
        }

        /**
         * 處理選項點擊驗證
         */
        function handleAnswerSelect(selectedIdx) {
            const qData = questionsData[currentHutIndex];
            const isCorrect = (selectedIdx === qData.answer);

            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.querySelectorAll('button');

            // 禁用所有按鈕
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-amber-50', 'hover:border-amber-400');

                if (idx === qData.answer) {
                    btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('bg-red-100', 'border-red-400', 'text-red-900');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            // 顯示解析說明盒
            const explBox = document.getElementById('explanation-box');
            const statusTitle = document.getElementById('result-status-title');
            const explText = document.getElementById('explanation-text');

            explBox.classList.remove('hidden');

            if (isCorrect) {
                correctCount++;
                document.getElementById('score-text').innerText = correctCount;
                playBeepSound(800, 'triangle', 0.2); // 答對音效

                explBox.className = 'p-4 rounded-2xl bg-emerald-50 border border-emerald-200';
                statusTitle.className = 'flex items-center space-x-2 font-bold text-base mb-1 text-emerald-700';
                statusTitle.innerHTML = `<i class="fa-solid fa-circle-check text-xl"></i><span>回答正確！好棒！</span>`;
            } else {
                playBeepSound(300, 'sawtooth', 0.3); // 答錯音效

                explBox.className = 'p-4 rounded-2xl bg-amber-50 border border-amber-200';
                statusTitle.className = 'flex items-center space-x-2 font-bold text-base mb-1 text-amber-700';
                statusTitle.innerHTML = `<i class="fa-solid fa-circle-xmark text-xl"></i><span>差一點點！吸取知識繼續加油！</span>`;
            }

            explText.innerText = qData.explanation;
        }

        /**
         * 關閉題目對話框並「隱藏/消失已回答的茅草屋」
         */
        function closeAndHideHut() {
            // 隱藏對話框
            document.getElementById('question-modal').classList.add('hidden');

            if (currentHutIndex !== null) {
                // 將該茅草屋標記為已回答
                answeredHuts.add(currentHutIndex);

                // 【核心優化】：即時淡出隱藏茅草屋 (hut.png)
                const targetHut = document.getElementById(`hut-${currentHutIndex}`);
                if (targetHut) {
                    targetHut.classList.add('hut-hidden');
                }
                currentHutIndex = null;
            }

            // 檢查是否符合過關或結束條件
            checkGameStatus();
        }

        /**
         * 判斷過關與結算邏輯
         * 規則 1：只要答對 >= 8 題，立即成功過關！
         * 規則 2：10 題皆回答完且答對 < 8 題，失敗結算，重新挑戰。
         */
        function checkGameStatus() {
            // 條件 1：累積答對達到 8 題 -> 立即過關！
            if (correctCount >= 8) {
                setTimeout(() => {
                    showFinalResultModal(true);
                }, 400);
                return;
            }

            // 條件 2：10 題全部做答完畢但答對 < 8 題 -> 失敗結算
            if (answeredHuts.size >= 10 && correctCount < 8) {
                setTimeout(() => {
                    showFinalResultModal(false);
                }, 400);
            }
        }

        /**
         * 顯示結算 Modal 視窗
         */
        function showFinalResultModal(isVictory) {
            const modal = document.getElementById('result-modal');
            const iconContainer = document.getElementById('result-icon-container');
            const title = document.getElementById('result-title');
            const subtitle = document.getElementById('result-subtitle');
            const actionBtn = document.getElementById('result-action-btn');

            document.getElementById('final-correct-count').innerText = correctCount;
            document.getElementById('final-total-count').innerText = answeredHuts.size;

            if (isVictory) {
                // 勝利彩帶動畫特效
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }

                playVictoryFanfare();

                iconContainer.className = 'text-6xl text-amber-500 animate-bounce';
                iconContainer.innerHTML = `<i class="fa-solid fa-trophy"></i>`;
                title.innerText = '恭喜過關！';
                title.className = 'text-2xl sm:text-3xl font-black text-emerald-600';
                subtitle.innerText = `太厲害了！你已順利答對 ${correctCount} 題，成功通過第一關！`;

                actionBtn.href = 'level2.html';
                actionBtn.className = 'block w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold rounded-2xl shadow-lg text-lg transition transform hover:-translate-y-0.5';
                actionBtn.innerHTML = `前往下一關 (Level 2) <i class="fa-solid fa-arrow-right ml-1"></i>`;
            } else {
                iconContainer.className = 'text-6xl text-slate-400';
                iconContainer.innerHTML = `<i class="fa-solid fa-rotate-left"></i>`;
                title.innerText = '挑戰未完成';
                title.className = 'text-2xl sm:text-3xl font-black text-slate-700';
                subtitle.innerText = `你共回答完 10 題，答對 ${correctCount} 題。需要答對 8 題以上才能過關喔！`;

                actionBtn.href = 'javascript:location.reload()';
                actionBtn.className = 'block w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold rounded-2xl shadow-lg text-lg transition transform hover:-translate-y-0.5';
                actionBtn.innerHTML = `<i class="fa-solid fa-rotate-right mr-1"></i> 重新挑戰本關`;
            }

            modal.classList.remove('hidden');
        }

        /**
         * 設置事件監聽器
         */
        function setupEventListeners() {
            // Modal 關閉按鈕
            document.getElementById('close-modal-btn').addEventListener('click', () => {
                document.getElementById('question-modal').classList.add('hidden');
            });

            // 繼續按鈕
            document.getElementById('next-question-btn').addEventListener('click', closeAndHideHut);

            // 重新開始按鈕
            document.getElementById('restart-btn').addEventListener('click', () => {
                location.reload();
            });

            // 音訊開關切換
            document.getElementById('bgm-toggle-btn').addEventListener('click', toggleAudio);

            // 頁面首次點擊自動啟用音訊 Context
            document.body.addEventListener('click', initAudioContext, { once: true });
        }

        /**
         * 初始化 Web Audio 上下文 (解決瀏覽器自動播放限制)
         */
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        /**
         * 切換背景音樂開關
         */
        function toggleAudio() {
            initAudioContext();
            const bgmIcon = document.getElementById('bgm-icon');

            if (isAudioPlaying) {
                stopBGM();
                bgmIcon.className = 'fa-solid fa-volume-xmark text-lg text-slate-500';
                isAudioPlaying = false;
            } else {
                startBGM();
                bgmIcon.className = 'fa-solid fa-volume-high text-lg text-amber-500';
                isAudioPlaying = true;
            }
        }

        /**
         * 播放溫馨放鬆的微型旋律背景音 (使用 Web Audio API 生成)
         */
        function startBGM() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // 旋律音符頻率陣列 (輕鬆 C 大調)
            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66];
            let noteIndex = 0;

            function playNextNote() {
                if (!isAudioPlaying) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);

                noteIndex = (noteIndex + 1) % notes.length;
                setTimeout(playNextNote, 600);
            }

            playNextNote();
        }

        function stopBGM() {
            isAudioPlaying = false;
        }

        /**
         * 簡單效果音發聲器
         */
        function playBeepSound(freq, type = 'sine', duration = 0.15) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // 忽略未交互前的音訊例外
            }
        }

        /**
         * 過關慶祝音效
         */
        function playVictoryFanfare() {
            if (!audioCtx) return;
            const fanfareNotes = [440, 554.37, 659.25, 880];
            fanfareNotes.forEach((freq, idx) => {
                setTimeout(() => {
                    playBeepSound(freq, 'triangle', 0.3);
                }, idx * 150);
            });
        }
    </script>
